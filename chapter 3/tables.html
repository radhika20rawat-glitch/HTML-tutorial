<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables- HTML</title>
    <style>/* Page Background */
body {
    background-color: #a689c4;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
}

/* Page Heading */
h1 {
    text-align: center;
    color: rgb(29, 4, 66);
    margin-bottom: 30px;
}

/* Table Styling */
table {
    width: 70%;
    margin: auto;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    font-size: 16px; /* Same font size for all */
}

/* Header Style */
thead th {
    background-color: #4a125b;
    color: white;
    padding: 12px;
    text-align: left;
}

/* Table Data */
tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    border: 2px solid black;
}

/* Hover Row Effect */
tbody tr:hover {
    background-color: #f5f5f5;
}
</style>
</head>
<body>
    <h1><u>Tables in HTML</u></h1>
    <table>
        <!--tr tage is used to display table row -->
        <!--td is used to display table data -->
        <!--th is used in place of table data for displaying table headers-->
        <thead>
            <!--head of the table -->
            <tr>
                <th>Name </th>
                <th>Role </th>
                <th>Salary</th>


            </tr>

        </thead>
        <tbody>
            <!--body of the table-->
            <tr>
                <td>Radhika</td>
                <td>Software Developer</td>
                <td>$100</td>
            </tr>

            <tr>
                <td>Yashika</td>
                <td>Data scientist</td>
                <td>$100</td>
            </tr>

            <tr>
                <td>Shruti</td>
                <td>Web developer</td>
                <td>$100</td>
            </tr>

             <tr>
                <td>Shivam</td>
                <td>AI Engineer</td>
                <td>$100</td>
            </tr>

        </tbody>







    </table>

</body>
</html>
